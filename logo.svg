<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo oscuro estilo IDE -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>
    
    <!-- Gradiente Cian Neón Principal -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Gradiente Azul Profundo -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a52be"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <!-- Efecto de brillo sutil -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Fondo con esquinas redondeadas (Formato App Icon moderno) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2b2b3d" stroke-width="4"/>
  
  <!-- Contenido del Isotipo (RGS Code) -->
  <g transform="translate(64, 64)">
    <!-- Corchete de apertura (<) -->
    <path d="M 80 110 L 40 160 L 80 210" fill="none" stroke="url(#neonCyan)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Letra R geométrica integrada -->
    <path d="M 135 110 L 215 110 C 255 110 275 130 275 158 C 275 182 255 202 225 208 L 285 270 L 230 270 L 175 210 L 135 210 L 135 270 L 91 270 L 91 110 Z M 135 145 L 135 175 L 210 175 C 225 175 235 168 235 158 C 235 150 225 145 210 145 Z" fill="url(#neonCyan)"/>
    
    <!-- Corchete de cierre (>) -->
    <path d="M 304 110 L 344 160 L 304 210" fill="none" stroke="url(#neonBlue)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Punto característico de extensión (.Code) -->
    <circle cx="324" cy="270" r="14" fill="url(#neonCyan)" filter="url(#glow)"/>
  </g>
</svg>
